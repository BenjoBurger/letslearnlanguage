name: Expo CI

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo doctor
        run: npm run check:prebuild

      - name: Run linter
        run: npm run lint

  build:
    name: EAS build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo doctor
        run: npm run check:prebuild

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_DEV }}

      - name: Run EAS build
        run: eas build --platform android --profile development --non-interactive --no-wait